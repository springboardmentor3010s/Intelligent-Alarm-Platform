# Production nginx for the CerebroKognit SPA (Phase 9).
# - SPA fallback so /alarms, /reports, ... deep links work on refresh.
# - Long-cache immutable assets; never cache index.html.
# - Security headers mirror the API's SecurityHeadersMiddleware posture.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
