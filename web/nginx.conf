# Production nginx for the CerebroKognit SPA (Phase 9).
# - SPA fallback so /alarms, /reports, ... deep links work on refresh.
# - Long-cache immutable assets; never cache index.html.
# - Security headers mirror the API's SecurityHeadersMiddleware posture.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API so the SPA's relative /api/v1/... calls reach the
    # FastAPI service on the compose network (no browser-side host config needed).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
