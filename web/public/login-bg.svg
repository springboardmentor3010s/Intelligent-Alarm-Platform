<!-- CerebroKognit | Developer: Pawan Simha R | Infosys Virtual Internship 7.0 | Guide: Shanmukha Priya -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="glowViolet" cx="18%" cy="6%" r="60%">
      <stop offset="0%" stop-color="#6844FD" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6844FD" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#6844FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="90%" cy="92%" r="65%">
      <stop offset="0%" stop-color="#58F6CA" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#58F6CA" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#58F6CA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6844FD" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58F6CA" stop-opacity="0.35"/>
