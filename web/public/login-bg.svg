  <g stroke="#6844FD" stroke-opacity="0.14" stroke-width="1">
    <path d="M0 80h1600M0 160h1600M0 240h1600M0 320h1600M0 400h1600M0 480h1600M0 560h1600M0 640h1600M0 720h1600M0 800h1600M0 880h1600M0 960h1600"/>
    <path d="M80 0v1000M160 0v1000M240 0v1000M320 0v1000M400 0v1000M480 0v1000M560 0v1000M640 0v1000M720 0v1000M800 0v1000M880 0v1000M960 0v1000M1040 0v1000M1120 0v1000M1200 0v1000M1280 0v1000M1360 0v1000M1440 0v1000M1520 0v1000"/>
  </g>

  <!-- Neural-net constellation (nodes + links) -->
  <g stroke="#6844FD" stroke-opacity="0.4" stroke-width="1">
    <path d="M240 260l180 120-60 220-190-70z"/>
    <path d="M420 380l150-60 110 150-90 130-170-60z"/>
    <path d="M240 260l170-110 160 90z"/>
    <path d="M750 470l190-90 130 120-60 200-210 60-50-190z"/>
    <path d="M330 600l390 130 150-20z"/>
    <path d="M540 320l210 220-180 230z"/>
    <path d="M940 380l210-160 150 130z"/>
  </g>
  <g fill="#6844FD">
    <circle cx="240" cy="260" r="3.5"/>
    <circle cx="570" cy="320" r="3"/>
    <circle cx="600" cy="600" r="3.5"/>
    <circle cx="420" cy="380" r="3"/>
    <circle cx="750" cy="470" r="3.5"/>
    <circle cx="1300" cy="350" r="3.5"/>
  </g>
  <g fill="#58F6CA" fill-opacity="0.9">
    <circle cx="1150" cy="220" r="3"/>
    <circle cx="1080" cy="820" r="3"/>
  </g>
  <g fill="#94a3b8" fill-opacity="0.6">
    <circle cx="410" cy="150" r="2"/>
    <circle cx="150" cy="540" r="2"/>
    <circle cx="410" cy="840" r="2"/>
    <circle cx="940" cy="160" r="2"/>
    <circle cx="1300" cy="640" r="2"/>
    <circle cx="1500" cy="860" r="2"/>
  </g>

  <!-- Ripple arcs (circuit-like) -->
  <g fill="none" stroke="url(#line)" stroke-width="1.5">
    <path d="M1080 470a220 220 0 0 1 220-220" stroke-opacity="0.5"/>
    <path d="M900 500a330 330 0 0 1 260-270" stroke-opacity="0.25"/>
    <path d="M240 260a40 40 0 0 1 40-40" stroke-opacity="0.6"/>
  </g>

  <!-- Circuit chip detail -->
  <g stroke="#6844FD" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <rect x="920" y="170" width="86" height="86" rx="6" stroke-opacity="0.35"/>
