version: "3.9"

services:

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: cerebrokognit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cerebro_kognit
      POSTGRES_USER: cerebro_user
      POSTGRES_PASSWORD: change_me
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro_user -d cerebro_kognit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (FastAPI)
  api:
    build: ./backend
    container_name: cerebrokognit-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cerebro_user:change_me@db:5432/cerebro_kognit
      SECRET_KEY: change_this_to_a_very_random_secret_key_min_32_bytes
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      DEBUG: True
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # Web dashboard (development: run locally with npm run dev)
  # Will be started manually since Dockerfile not included in repo
  #
  # Uncomment and configure if you want Docker to build the web app
  # web:
  #   build: ./web
  #   container_name: cerebrokognit-web
  #   restart: unless-stopped
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   environment:
  #     VITE_API_URL: http://localhost:8000
  #     VITE_ENABLE_ANALYTICS: true
  #   ports:
  #     - "5173:5173"

  # Mobile development (Expo)
  # Will be started locally with npx expo start
  # Uncomment if you want Docker to build the mobile app
  #
  # mobile:
  #   build: ./mobile
  #   container_name: cerebrokognit-mobile
  #   restart: unless-stopped
  #   environment:
  #     EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
  #   ports:
  #     - "19000:19000"  # Expo Go
  #     - "19001:19001"  # Metro
  #     - "19002:19002"  # Debugger

volumes:
  pg_data: