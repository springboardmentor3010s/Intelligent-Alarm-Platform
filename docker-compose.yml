services:
  # ===================================================================
  # 1. PostgreSQL Database Service
  # ===================================================================
  db:
    image: postgres:16-alpine
    container_name: cognitive_alarm_db
    environment:
      POSTGRES_DB: cognitive_alarm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cognitive_alarm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===================================================================
  # 2. FastAPI Backend Application Service
  # ===================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognitive_alarm_backend
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/cognitive_alarm_db
      SECRET_KEY: ${SECRET_KEY:-default_secure_secret_key_change_in_production_32chars}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ===================================================================
  # 3. Nginx Web Server & React Frontend Service
  # ===================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognitive_alarm_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# =====================================================================
# Networks & Persistent Volumes
# =====================================================================
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
