# CerebroKognit PRODUCTION overlay (Phase 9) — local production-like validation.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Secrets have NO defaults here: compose aborts unless POSTGRES_PASSWORD and
# SECRET_KEY are set in the environment (or .env.docker). No public-cloud
# deployment is performed by this repo; this file validates the exact image
# and configuration that would ship.
services:

  db:
    # Do not publish Postgres to the host in production; operate via exec.
    ports: []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cerebro_kognit}
      POSTGRES_USER: ${POSTGRES_USER:-cerebro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the production stack}

  api:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerebro_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the production stack}@db:5432/${POSTGRES_DB:-cerebro_kognit}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY (min 32 random bytes) before starting the production stack}
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the exact production frontend origin(s)}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-noop}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Optional secondary event log; empty = silent no-op (Postgres is the
      # only required datastore). Set to a hosted (Atlas) URI for cloud.
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DB: ${MONGODB_DB:-cerebrokognit_events}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${API_PORT:-8000}:8000"

  # Production web frontend: Vite build served by nginx (SPA fallback).
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: cerebrokognit-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
